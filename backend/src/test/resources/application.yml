spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test_teaching_system;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  type-aliases-package: com.school.teaching.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: test-secret-key-for-unit-tests-only
  expiration: 86400000
  header: Authorization
  prefix: Bearer

server:
  port: 0

logging:
  level:
    root: WARN
    com.school.teaching: DEBUG
