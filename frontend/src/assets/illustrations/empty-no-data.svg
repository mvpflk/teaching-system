<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="暂无数据">
  <!-- Empty folder: C4 no-data variant -->
  <!-- Soft decorative dots (brand accent) -->
  <circle cx="60" cy="55" r="4" fill="#4cc9f0" opacity="0.5"/>
  <circle cx="350" cy="245" r="3" fill="#4361ee" opacity="0.3"/>
  <circle cx="340" cy="60" r="2.5" fill="#4361ee" opacity="0.25"/>
  <!-- Open folder outline -->
  <path d="M60 130
           L60 220
           Q60 232 72 232
           L330 232
           Q340 232 340 222
           L340 174
           Q340 164 330 164
           L150 164
           Q138 164 134 154
           L126 138
           Q122 130 112 130
           Z"
        stroke="#4361ee" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Folder top tab -->
  <path d="M60 130
           L152 130
           Q162 130 168 138
           L176 148
           Q180 154 188 154
           L340 154
           Q340 142 328 142
           L200 142
           Q188 142 184 132
           L176 120
           Q170 114 160 114
           L60 114
           Q60 126 60 130 Z"
        stroke="#4361ee" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="rgba(67,97,238,0.04)"/>
  <!-- Small empty document peeking out -->
  <rect x="170" y="180" width="60" height="68" rx="3"
        stroke="#4cc9f0" stroke-width="1.5" fill="rgba(76,201,240,0.03)"/>
  <path d="M180 196 L220 196 M180 208 L212 208 M180 220 L216 220 M180 232 L204 232"
        stroke="#4361ee" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Floating "plus" hint (subtle invitation to create) -->
  <g transform="translate(260,170)">
    <circle r="16" fill="rgba(67,97,238,0.06)" stroke="#4361ee" stroke-width="1.2" stroke-dasharray="2 3"/>
    <path d="M-6 0 H6 M0 -6 V6" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
