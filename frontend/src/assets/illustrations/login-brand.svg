<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="教学管理系统 - 品牌插画">
  <!-- Login hero: abstract classroom (chalkboard + book path + 3 students) → geometric, not kitsch -->
  <!-- Decorative background dots -->
  <circle cx="50" cy="55" r="4" fill="#4cc9f0" opacity="0.45"/>
  <circle cx="360" cy="250" r="3.5" fill="#4361ee" opacity="0.3"/>
  <circle cx="348" cy="48" r="2.5" fill="#4361ee" opacity="0.25"/>
  <circle cx="52" cy="248" r="3" fill="#7209b7" opacity="0.2"/>
  <!-- Chalkboard frame -->
  <rect x="110" y="40" width="180" height="116" rx="6"
        stroke="#4361ee" stroke-width="1.8" fill="rgba(67,97,238,0.03)"/>
  <rect x="118" y="48" width="164" height="100" rx="3"
        stroke="#4361ee" stroke-width="1.2" stroke-dasharray="1 5" opacity="0.2"/>
  <!-- Chalkboard content: formula checkmark → learning success -->
  <path d="M142 90 L158 106 L186 78" stroke="#4361ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M204 78 H256 M204 98 H248 M204 118 H240" stroke="#4cc9f0" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M204 134 Q230 128 256 140" stroke="#7209b7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Book / learning path: open book under chalkboard -->
  <path d="M80 200
           Q80 186 140 188
           L200 194
           L260 188
           Q320 186 320 200
           Q320 212 260 212
           L200 208
           L140 212
           Q80 212 80 200 Z"
        stroke="#4361ee" stroke-width="1.5" stroke-linejoin="round" fill="rgba(67,97,238,0.035)"/>
  <path d="M200 194 V208" stroke="#4361ee" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Book pages: content lines -->
  <path d="M100 198 L136 196 M100 204 L130 202 M100 210 L130 208" stroke="#4361ee" stroke-width="0.9" stroke-linecap="round" opacity="0.28"/>
  <path d="M264 196 L300 198 M270 202 L300 204 M270 208 L300 210" stroke="#4361ee" stroke-width="0.9" stroke-linecap="round" opacity="0.28"/>
  <!-- 3 stylised student avatars (learning path upwards) -->
  <!-- Student 1 (left, beginning) -->
  <g transform="translate(110,228)">
    <circle cx="0" cy="-12" r="8" stroke="#4cc9f0" stroke-width="1.3" fill="rgba(76,201,240,0.08)"/>
    <path d="M-14 10 Q0 -2 14 10" stroke="#4cc9f0" stroke-width="1.3" stroke-linecap="round" fill="rgba(76,201,240,0.05)"/>
  </g>
  <!-- Student 2 (middle, progressing) -->
  <g transform="translate(200,228)">
    <circle cx="0" cy="-14" r="8" stroke="#4361ee" stroke-width="1.3" fill="rgba(67,97,238,0.08)"/>
    <path d="M-14 8 Q0 -4 14 8" stroke="#4361ee" stroke-width="1.3" stroke-linecap="round" fill="rgba(67,97,238,0.05)"/>
  </g>
  <!-- Student 3 (right, reaching goal → checkmark circle) -->
  <g transform="translate(290,228)">
    <circle cx="0" cy="-14" r="8" stroke="#7209b7" stroke-width="1.3" fill="rgba(114,9,183,0.06)"/>
    <path d="M-14 8 Q0 -4 14 8" stroke="#7209b7" stroke-width="1.3" stroke-linecap="round" fill="rgba(114,9,183,0.04)"/>
  </g>
  <!-- Stepping chevrons: progress path (low opacity, not distracting) -->
  <path d="M134 248 L170 238 L134 228" stroke="#4cc9f0" stroke-width="1.1" fill="none" opacity="0.35"/>
  <path d="M200 248 L236 238 L200 228" stroke="#4361ee" stroke-width="1.1" fill="none" opacity="0.4"/>
  <path d="M266 248 L302 238 L266 228" stroke="#7209b7" stroke-width="1.1" fill="none" opacity="0.45"/>
  <!-- Brand wordmark bottom -->
  <g transform="translate(200,288)" opacity="0.6">
    <text x="0" y="0" text-anchor="middle"
          font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="11" font-weight="700" fill="#4361ee" letter-spacing="5">
      TEACH · LEARN · GROW
    </text>
  </g>
</svg>
