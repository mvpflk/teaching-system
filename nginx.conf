worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;

    # SSE专用上游：HTTP/1.1 + keepalive连接池
    upstream backend_sse {
        server backend:8080;
        keepalive 64;
    }

    # 通用API上游
    upstream backend_api {
        server backend:8080;
        keepalive 32;
    }

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /prometheus/ {
        proxy_pass http://teaching-prometheus:9090;
        proxy_set_header Host $host;
    }
    location /grafana/ {
        proxy_pass http://teaching-grafana:3000;
        proxy_set_header Host $host;
    }
    location /alertmanager/ {
        proxy_pass http://teaching-alertmanager:9093;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA: 静态资源(/static/)永久缓存, HTML入口每次验证
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # === SSE 端点（HTTP/1.1 + keepalive + 禁用缓冲） ===

    # 课堂互动 SSE（心跳30s，120s超时足够）
    location /api/classroom/ {
        proxy_pass http://backend_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # 个人通知 SSE
    location /api/sse/ {
        proxy_pass http://backend_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # 打字竞赛 SSE
    location /api/typing/competitions {
        proxy_pass http://backend_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # AI流式输出（限速 + 长超时）
    location /api/ai-output/ {
        limit_req zone=ai_limit burst=10 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 上传端点（限速 + 大body）
    location /api/upload/ {
        limit_req zone=upload_limit burst=10 nodelay;
        client_max_body_size 20M;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 通用API回退
    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 上传文件静态服务
    location /uploads/ {
        proxy_pass http://backend_api/api/uploads/;
    }
}
}
