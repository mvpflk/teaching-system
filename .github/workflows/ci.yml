name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建 + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: teaching_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -u root -ptest123 teaching_system < ../database/init.sql
        env:
          MYSQL_PWD: test123

      - name: Maven 编译
        run: mvn compile -q

      - name: Maven 测试
        run: >
          mvn test
          -Dtest="!CoreApiSmokeTest,!CreditServiceTest,!ClassroomServiceImplTest,!AiQuestionGeneratorServiceTest"
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/teaching_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          DB_USERNAME: root
          DB_PASSWORD: test123
          JWT_SECRET: test-jwt-secret-for-ci-at-least-32-chars!!
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ''
          CORS_ORIGINS: http://localhost:3000

  frontend:
    name: 前端 lint + 测试 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci
        env:
          HUSKY: 0

      - name: ESLint 检查
        run: npm run lint:check

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build

  docker:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t teaching-system-backend -f Dockerfile.backend .

      - name: 构建前端镜像
        run: docker build -t teaching-system-frontend -f Dockerfile.frontend .
